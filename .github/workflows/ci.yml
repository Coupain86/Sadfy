name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Types, lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # L'ordre de compilation vit dans `npm run build:deps`, pas ici.
      # Le répéter dans la CI garantissait qu'il finisse par diverger de la réalité —
      # c'est exactement ce qui est arrivé quand l'application s'est mise à dépendre
      # du noyau du serveur : la CI ne compilait que le paquet partagé.
      - run: npm run build:deps

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      # Rien ne part si un test échoue : c'est la première des trois couches de
      # sécurité des mises à jour (déploiement progressif et retour arrière suivent).
